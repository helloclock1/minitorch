# как честный студент, признаюсь, что со всеми вашими ci мне было лень разбираться и это делала новейшая разработка лаборатории anthropic под названием opus 5.5
# https://claude.ai/share/e0183fec-0812-4393-a7be-3e25cc84b927
#
name: Python package

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Test with pytest
      run: |
        TESTS="tests/test_operators.py tests/test_module.py tests/test_autodiff.py tests/test_scalar.py"
        for t in task0_1 task0_2 task0_3 task0_4 task1_1 task1_2 task1_3 task1_4; do
          pytest $TESTS -x -m $t
        done
